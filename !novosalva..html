<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#3B6B9E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>🛠️ Ministrando à Maneira do Senhor</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiTWluaXN0cmFuZG8iLCJzaG9ydF9uYW1lIjoiTWluaXN0cmFyIiwic3RhcnRfdXJsIjoiLiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiNGNEY1RjciLCJ0aGVtZV9jb2xvciI6IiMzQjZCOUUifQ==">
<style>
:root{
--p:#3B6B9E;--pl:#6B9FCC;--pd:#2A5478;--pc:rgba(59,107,158,.12);
--a:#C8850A;--al:#E8B44A;
--ok:#2D8F6F;--w:#B8860B;--ng:#C0392B;--info:#2980B9;--or:#CB6D3B;
--bg:#F4F5F7;--bg2:#FFF;--bg3:#ECEEF1;--bg4:#D5D8DC;
--tx:#2C3E50;--tx2:#5D6D7E;--tx3:#ABB2B9;
--sh:0 2px 10px rgba(0,0,0,.06);--sh2:0 6px 24px rgba(0,0,0,.1);
--r:12px;--r2:16px;
--sw:260px;--hh:56px;--bh:64px;
}
[data-theme=dark]{
--bg:#1B2631;--bg2:#212F3D;--bg3:#2C3E50;--bg4:#34495E;
--tx:#D5D8DC;--tx2:#ABB2B9;--tx3:#5D6D7E;--pc:rgba(107,159,204,.15);
--sh:0 2px 10px rgba(0,0,0,.25);--sh2:0 6px 24px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--pl);border-radius:3px}
.hid{display:none!important}
button{font-family:inherit}
a{color:var(--p);text-decoration:none}

/* SIDEBAR */
.sb{position:fixed;left:0;top:0;width:var(--sw);height:100vh;background:var(--bg2);border-right:1px solid var(--bg4);z-index:100;transition:transform .3s;overflow-y:auto;display:flex;flex-direction:column}
.sb.shut{transform:translateX(-100%)}
.sb-h{padding:16px;text-align:center;border-bottom:1px solid var(--bg4)}
.sb-h h2{font-size:14px;color:var(--p);margin-top:4px}
.sb-h small{color:var(--tx2);font-size:10px}
.ns{padding:6px 14px;font-size:9px;text-transform:uppercase;color:var(--tx3);letter-spacing:1.2px;margin-top:10px;font-weight:600}
.ni{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:.15s;border-radius:8px;margin:1px 8px;font-size:13px;color:var(--tx2);user-select:none}
.ni:hover,.ni.on{background:var(--p);color:#fff}
.ni .ic{font-size:15px;width:22px;text-align:center;flex-shrink:0}
.sb-f{margin-top:auto;padding:10px;border-top:1px solid var(--bg4)}

/* HEADER */
.hd{position:fixed;top:0;left:var(--sw);right:0;height:var(--hh);background:var(--bg2);border-bottom:1px solid var(--bg4);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:90;transition:left .3s}
.hd.full{left:0}
.hd-l{display:flex;align-items:center;gap:10px}
.hd-bc{font-size:11px;color:var(--tx3);margin-left:4px}
.mbtn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--tx);display:none;padding:2px}
.hd-t{font-size:15px;font-weight:600}
.hd-r{display:flex;align-items:center;gap:8px}
.hb{background:var(--bg3);border:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.2s;color:var(--tx)}
.hb:hover{background:var(--p);color:#fff}
.hb.has-notif{position:relative}
.hb.has-notif::after{content:'';position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--ng);border:2px solid var(--bg2)}

/* BOTTOM NAV (mobile) */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bh);background:var(--bg2);border-top:1px solid var(--bg4);z-index:95;justify-content:space-around;align-items:center;padding:0 4px;padding-bottom:env(safe-area-inset-bottom)}
.bn-i{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;cursor:pointer;color:var(--tx3);font-size:10px;transition:.15s;border-radius:8px;min-width:52px}
.bn-i.on{color:var(--p)}
.bn-i .bi{font-size:20px}

/* MAIN */
.mn{margin-left:var(--sw);margin-top:var(--hh);padding:20px;min-height:calc(100vh - var(--hh));transition:margin-left .3s}
.mn.full{margin-left:0}

/* AVATAR */
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;text-transform:uppercase}
.av-sm{width:32px;height:32px;font-size:12px}
.av-lg{width:60px;height:60px;font-size:22px}

/* CARDS */
.cd{background:var(--bg2);border-radius:var(--r2);padding:16px;box-shadow:var(--sh);transition:.2s}
.cd:hover{box-shadow:var(--sh2)}
.cd-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cd-t{font-size:15px;font-weight:600}

/* GRID */
.g{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.ga{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}

/* STAT */
.sc{background:var(--bg2);border-radius:var(--r2);padding:16px;box-shadow:var(--sh);text-align:center;transition:.2s;cursor:pointer;position:relative;overflow:hidden}
.sc:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.sc .si{font-size:28px;margin-bottom:6px}
.sc .sv{font-size:26px;font-weight:700;color:var(--p)}
.sc .sl{font-size:11px;color:var(--tx2);margin-top:3px}
.sc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.sc.grn::after{background:var(--ok)}.sc.ylw::after{background:var(--w)}.sc.orn::after{background:var(--or)}.sc.red::after{background:var(--ng)}.sc.acc::after{background:var(--a)}.sc.pri::after{background:var(--p)}

/* BTN */
.bt{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-weight:500;transition:.2s;white-space:nowrap}
.bp{background:var(--p);color:#fff}.bp:hover{background:var(--pd)}
.ba{background:var(--a);color:#fff}.ba:hover{opacity:.9}
.bs{background:var(--ok);color:#fff}
.bd{background:var(--ng);color:#fff}
.bo{background:transparent;border:2px solid var(--p);color:var(--p)}.bo:hover{background:var(--p);color:#fff}
.bsm{padding:5px 10px;font-size:11px;border-radius:8px}
.blg{padding:12px 28px;font-size:15px;border-radius:14px}
.bbl{width:100%;justify-content:center}
.bic{width:32px;height:32px;padding:0;justify-content:center;border-radius:50%}
.bg{display:flex;gap:6px;flex-wrap:wrap}

/* FORM */
.fg{margin-bottom:14px}
.fl{display:block;margin-bottom:5px;font-size:12px;font-weight:500;color:var(--tx2)}
.fi,.fs,.ft{width:100%;padding:9px 12px;border:2px solid var(--bg4);border-radius:var(--r);font-size:13px;background:var(--bg);color:var(--tx);transition:.2s;font-family:inherit}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--p);outline:none;box-shadow:0 0 0 3px var(--pc)}
.fi.err{border-color:var(--ng)}
.ft{min-height:70px;resize:vertical}

/* BADGE */
.bd-g{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:16px;font-size:10px;font-weight:600}
.bdg{background:#d5eee4;color:#1e7a56}
.bdy{background:#f5ecd0;color:#8a6914}
.bdo{background:#f5dfd0;color:#a0522d}
.bdr{background:#f5d0d0;color:#a02020}
.bdp{background:var(--pc);color:var(--p)}
.bda{background:#f5ecd0;color:var(--a)}
[data-theme=dark] .bdg{background:#1a3a2a;color:#4fc}
[data-theme=dark] .bdy{background:#3a3520;color:#ec5}
[data-theme=dark] .bdo{background:#3a2515;color:#e95}
[data-theme=dark] .bdr{background:#3a1515;color:#f77}
[data-theme=dark] .bdp{background:#1e3450;color:var(--pl)}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:12px;opacity:0;visibility:hidden;transition:.25s}
.mo.on{opacity:1;visibility:visible}
.ml{background:var(--bg2);border-radius:var(--r2);width:100%;max-width:540px;max-height:88vh;overflow-y:auto;transform:scale(.92);transition:.25s}
.mo.on .ml{transform:scale(1)}
.ml-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bg4);position:sticky;top:0;background:var(--bg2);z-index:1}
.ml-h h3{font-size:16px}
.ml-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--tx2);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:.15s}
.ml-x:hover{background:var(--bg3)}
.ml-b{padding:16px 20px}
.ml-f{padding:12px 20px;border-top:1px solid var(--bg4);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--bg2)}

/* PROGRESS */
.pr{background:var(--bg4);border-radius:20px;height:7px;overflow:hidden}
.pb{height:100%;border-radius:20px;transition:width .6s;background:linear-gradient(90deg,var(--p),var(--a))}

/* TIMELINE */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--bg4)}
.tl-i{position:relative;margin-bottom:16px;padding-left:14px}
.tl-i::before{content:'';position:absolute;left:-19px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--p);border:2px solid var(--bg2)}
.tl-d{font-size:10px;color:var(--tx3)}
.tl-c{margin-top:3px;font-size:12px}

/* TABS */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--bg4);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 14px;cursor:pointer;font-size:12px;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:.15s}
.tab.on{color:var(--p);border-bottom-color:var(--p);font-weight:600}

/* TOAST */
.tc{position:fixed;bottom:80px;right:16px;z-index:300;display:flex;flex-direction:column;gap:6px;max-width:340px}
.tt{padding:10px 16px;border-radius:var(--r);color:#fff;font-size:12px;animation:si .3s;display:flex;align-items:center;gap:8px;box-shadow:var(--sh2)}
@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.tt-ok{background:var(--ok)}.tt-er{background:var(--ng)}.tt-wr{background:var(--or)}.tt-in{background:var(--info)}
.tt .undo-btn{background:rgba(255,255,255,.3);border:none;color:#fff;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:11px;margin-left:auto;white-space:nowrap}

/* ALERTS */
.al{padding:10px 14px;border-radius:var(--r);margin-bottom:10px;font-size:12px;display:flex;align-items:center;gap:8px}
.al-w{background:#f5ecd0;color:#6e5310;border:1px solid #e8d9a0}
.al-d{background:#f5d0d0;color:#721c24;border:1px solid #e0b0b0}
.al-s{background:#d5eee4;color:#155724;border:1px solid #b0d8c0}
.al-i{background:#d0e4f5;color:#0c5460;border:1px solid #b0cce0}
[data-theme=dark] .al-w{background:#3a3520;color:#ec5;border-color:#4a4530}
[data-theme=dark] .al-d{background:#3a1515;color:#f77;border-color:#4a2525}
[data-theme=dark] .al-s{background:#1a3a2a;color:#4fc;border-color:#2a4a3a}
[data-theme=dark] .al-i{background:#1a2a3a;color:#8cf;border-color:#2a3a4a}

/* INSPIRE */
.ib{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:10px 16px;border-radius:var(--r);margin-bottom:16px;font-size:12px;text-align:center;font-style:italic}

/* WELCOME */
.ws{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:76vh;text-align:center;padding:20px}
.wi{font-size:56px;margin-bottom:14px;animation:pu 2.5s infinite}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.wt{font-size:26px;font-weight:700;color:var(--p);margin-bottom:6px}
.wst{font-size:13px;color:var(--tx2);margin-bottom:20px}
.wsc{background:var(--bg3);border-radius:var(--r2);padding:16px;margin-bottom:28px;max-width:440px;font-style:italic;color:var(--tx2);line-height:1.6;border-left:4px solid var(--p);font-size:13px;text-align:left}
.wsc cite{display:block;margin-top:6px;font-style:normal;font-weight:600;color:var(--p)}

/* WIZARD */
.wz{display:flex;justify-content:center;gap:6px;margin-bottom:28px}
.wzs{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--bg4);color:var(--tx3);transition:.3s}
.wzs.on{background:var(--p);color:#fff;transform:scale(1.1)}
.wzs.ok{background:var(--ok);color:#fff}

/* FAMILY CARD */
.fc{background:var(--bg2);border-radius:var(--r2);padding:14px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;transition:.2s;cursor:pointer;border-left:4px solid var(--ok);margin-bottom:8px}
.fc:hover{box-shadow:var(--sh2);transform:translateX(3px)}
.fc.rl{border-left-color:var(--ok)}.fc.rm{border-left-color:var(--w)}.fc.rh{border-left-color:var(--or)}.fc.rc{border-left-color:var(--ng)}
.fn{font-weight:600;font-size:13px}
.fd{font-size:11px;color:var(--tx2);margin-top:2px}
.fa{display:flex;gap:4px;align-items:center}

/* ACTION CARD */
.ac{background:var(--bg2);border-radius:var(--r2);padding:14px;box-shadow:var(--sh);margin-bottom:10px;border-left:4px solid var(--p)}
.ac.urg{border-left-color:var(--ng)}
.ac .at{font-weight:600;font-size:13px}
.ac .ad{font-size:11px;color:var(--tx2);margin-top:3px}
.ac .ab{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}

/* MISSION */
.mi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r);background:var(--bg3);margin-bottom:7px;transition:.2s;cursor:pointer}
.mi:hover{background:var(--bg4)}
.mi.dn{opacity:.55;text-decoration:line-through}
.mc{width:22px;height:22px;border-radius:50%;border:2px solid var(--p);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px}
.mi.dn .mc{background:var(--ok);border-color:var(--ok);color:#fff}

/* CHART */
.chr{display:flex;align-items:end;gap:6px;height:140px;padding:0 4px}
.cc{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.cc .cb{width:100%;max-width:36px;border-radius:5px 5px 0 0;transition:height .5s;min-height:3px}
.cc .cl{font-size:9px;color:var(--tx3)}
.cc .cv{font-size:10px;font-weight:600}

/* CANVAS CHART */
.chart-canvas{width:100%;max-width:100%;height:auto;display:block}

/* SECTION */
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.st{font-size:20px;font-weight:700}
.sst{font-size:12px;color:var(--tx2)}

/* CHIP/TAG */
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:16px;font-size:11px;background:var(--bg3);color:var(--tx2);margin:2px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;cursor:pointer;transition:.15s}
.tag:hover{opacity:.8}

/* LIST */
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bg4);transition:.15s}
.li:hover{background:var(--bg3)}
.li:last-child{border-bottom:none}

/* CALENDAR */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ch{padding:6px;text-align:center;font-size:10px;font-weight:600;color:var(--tx2)}
.cy{padding:6px;text-align:center;font-size:12px;border-radius:8px;cursor:pointer;transition:.15s;min-height:32px;display:flex;align-items:center;justify-content:center}
.cy:hover{background:var(--pl);color:#fff}
.cy.td{background:var(--p);color:#fff;font-weight:700}
.cy.ev{position:relative}
.cy.ev::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--a)}
.cy.ot{color:var(--tx3)}

/* LEVEL */
.lvl{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg3);border-radius:var(--r);margin-bottom:14px}
.lvi{font-size:24px}.lvn{font-weight:600;font-size:13px}.lvx{font-size:10px;color:var(--tx2)}

/* FILTER */
.fb{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}

/* BACKDROP */
.bk{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99;display:none}
.bk.on{display:block}

/* EMPTY */
.es{text-align:center;padding:40px 16px;color:var(--tx3)}
.es .ei{font-size:44px;margin-bottom:10px}
.es p{margin-bottom:14px;font-size:13px}

/* SKELETON */
.skel{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200%;animation:shimmer 1.5s infinite;border-radius:var(--r);height:20px}
@keyframes shimmer{0%{background-position:200%}100%{background-position:-200%}}

/* FAB */
.fab{position:fixed;bottom:80px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--a);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:var(--sh2);z-index:80;transition:.2s;display:flex;align-items:center;justify-content:center}
.fab:hover{transform:scale(1.1)}
.fab:active{transform:scale(.95)}

/* COUNTER ANIMATION */
.cnt{transition:all .4s}

/* RELATIVE DATE */
.rd{font-size:10px;color:var(--tx3)}

/* PRINT */
@media print{
.sb,.hd,.bnav,.fab,.bk,.mo,.tc,.hb,.mbtn{display:none!important}
.mn{margin:0!important;padding:10px!important}
.cd,.sc,.ac,.fc{box-shadow:none!important;border:1px solid #ddd}
body{background:#fff!important;color:#000!important}
}

/* MEETING MODE */
body.meeting .sb,body.meeting .bnav,body.meeting .fab{display:none!important}
body.meeting .hd{left:0}body.meeting .mn{margin-left:0}

/* RESPONSIVE */
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
.sb{transform:translateX(-100%)}.sb.open{transform:translateX(0)}
.hd{left:0}.mn{margin-left:0;padding-bottom:calc(var(--bh) + 16px)}
.mbtn{display:flex}
.bnav{display:flex}
.fab{bottom:calc(var(--bh) + 12px)}
.tc{bottom:calc(var(--bh) + 12px)}
.g2,.g3,.g4{grid-template-columns:1fr}
.wt{font-size:20px}
}
@media(max-width:400px){.mn{padding:10px;padding-bottom:calc(var(--bh) + 12px)}.sc{padding:12px}.sc .sv{font-size:20px}}
.fade{animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.celeb{animation:cel .8s ease}
@keyframes cel{0%{transform:scale(1)}25%{transform:scale(1.15) rotate(4deg)}50%{transform:scale(.92) rotate(-4deg)}75%{transform:scale(1.08)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="bk" id="bk" onclick="A.sidebar(false)"></div>
<nav class="sb" id="sb">
<div class="sb-h"><div style="font-size:28px">🛠️</div><h2>Ministrando à Maneira<br>do Senhor</h2><small>Cuidando de pessoas como o Salvador cuidaria</small></div>
<div style="flex:1;overflow-y:auto;padding:6px 0" id="navItems"></div>
<div class="sb-f"><div class="ni" onclick="A.meeting()" id="meetBtn"><span class="ic">📺</span>Modo Reunião</div><div class="ni" onclick="A.reset()" style="color:var(--ng)"><span class="ic">🔄</span>Reiniciar</div></div>
</nav>
<header class="hd" id="hd">
<div class="hd-l"><button class="mbtn" onclick="A.sidebar()">☰</button><span class="hd-t" id="ht">Início</span><span class="hd-bc" id="hbc"></span></div>
<div class="hd-r">
<button class="hb" onclick="A.showSearch()" title="Pesquisar (/)">🔍</button>
<button class="hb" onclick="A.showAlerts()" title="Alertas" id="nb">🔔</button>
<button class="hb" onclick="A.theme()" title="Tema" id="tb">🌙</button>
</div>
</header>
<div class="bnav" id="bnav">
<div class="bn-i on" data-v="welcome" onclick="A.go('welcome')"><span class="bi">🏠</span>Início</div>
<div class="bn-i" data-v="today" onclick="A.go('today')"><span class="bi">🔧</span>Ministrar</div>
<div class="bn-i" data-v="families" onclick="A.go('families')"><span class="bi">👥</span>Famílias</div>
<div class="bn-i" data-v="dashboard" onclick="A.go('dashboard')"><span class="bi">📊</span>Painel</div>
<div class="bn-i" data-v="settings" onclick="A.go('settings')"><span class="bi">⚙️</span>Mais</div>
</div>
<main class="mn" id="mn"></main>
<button class="fab hid" id="fab" onclick="A.fab()">➕</button>
<div class="mo" id="mo"><div class="ml"><div class="ml-h"><h3 id="mt"></h3><button class="ml-x" onclick="A.cm()">✕</button></div><div class="ml-b" id="mb"></div><div class="ml-f" id="mf"></div></div></div>
<div class="tc" id="tc"></div>
<script>
const A={
v:'welcome',d:{},_undo:null,
NAV:[
{s:'Principal',items:[{v:'welcome',i:'🏠',t:'Início'},{v:'today',i:'🔧',t:'Ministrar Hoje'},{v:'dashboard',i:'📊',t:'Painel'},{v:'mission',i:'🎯',t:'Missão da Semana'},{v:'actions',i:'📌',t:'Próximas Ações'}]},
{s:'Cuidado',items:[{v:'families',i:'👥',t:'Famílias'},{v:'companions',i:'🤝',t:'Companheiros'},{v:'needs',i:'📋',t:'Oportunidades de Servir'},{v:'records',i:'📝',t:'Registros'},{v:'activities',i:'📆',t:'Atividades da Ala'}]},
{s:'Organização',items:[{v:'neighborhoods',i:'📍',t:'Bairros e Regiões'},{v:'calendar',i:'📅',t:'Calendário'},{v:'planner',i:'📋',t:'Planejador'},{v:'messages',i:'💬',t:'Mensagens'},{v:'documents',i:'📂',t:'Documentos'}]},
{s:'Inspiração',items:[{v:'miracles',i:'✨',t:'Milagres'},{v:'levels',i:'⭐',t:'Níveis e Conquistas'},{v:'impact',i:'📈',t:'Vidas Fortalecidas'}]},
{s:'Liderança',items:[{v:'wardview',i:'⛪',t:'Visão da Ala'},{v:'hierarchy',i:'🏛️',t:'Organização'},{v:'wardhealth',i:'📋',t:'Saúde da Ala'}]},
{s:'Sistema',items:[{v:'settings',i:'⚙️',t:'Configurações'},{v:'backup',i:'💾',t:'Backup'},{v:'profiles',i:'👤',t:'Perfis'}]}
],
DEFS:{companions:[],families:[],records:[],needs:[],miracles:[],events:[],activities:[],documents:[],planner:[],tags:[],
messages_templates:[{c:'Contato',t:'Olá! Como vocês estão? Estamos pensando em vocês.'},{c:'Aniversário',t:'Feliz aniversário! Que Deus abençoe vocês neste dia especial!'},{c:'Boas-vindas',t:'Bem-vindos à nossa ala! Estamos felizes com a presença de vocês.'},{c:'Convite',t:'Gostaríamos de convidá-los para a atividade da ala.'},{c:'Espiritual',t:'Lembrem-se: "O Senhor está convosco enquanto vós estiverdes com ele."'},{c:'Acompanhamento',t:'Olá! Passando para saber como estão. Precisam de algo?'},{c:'Agradecimento',t:'Obrigado pela presença e pelo exemplo.'},{c:'Emergência',t:'Estamos orando por vocês. Se precisarem de qualquer coisa, conte conosco.'}],
neighborhoods:[],regions:[],
categories:['Saúde','Emprego','Moradia','Financeiro','Alimentação','Transporte','Espiritual','Emocional','Idosos','Jovens','Crianças'],
priorities:[{n:'Baixa',c:'grn'},{n:'Média',c:'ylw'},{n:'Alta',c:'orn'},{n:'Urgente',c:'red'}],
levels:[{n:'Semente',i:'🌱',x:0},{n:'Mão Amiga',i:'🤝',x:50},{n:'Servidor Ativo',i:'🔧',x:120},{n:'Visitador Fiel',i:'🏠',x:250},{n:'Companheiro Exemplar',i:'⭐',x:400},{n:'Servo Dedicado',i:'🌟',x:600},{n:'Mãos do Salvador',i:'👑',x:1000}],
achievements:[{n:'Consolador',i:'🤝',d:'Consolou 5 famílias',r:5,t:'cons'},{n:'Resgatador',i:'🌱',d:'3 famílias retornaram',r:3,t:'resc'},{n:'Amigo Fiel',i:'👊',d:'10 contatos',r:10,t:'cont'},{n:'Porta Aberta',i:'🏠',d:'5 visitas',r:5,t:'vis'},{n:'Exemplo',i:'⭐',d:'20 registros',r:20,t:'rec'},{n:'Esperança',i:'🙏',d:'10 msg espirituais',r:10,t:'spi'},{n:'Salvador',i:'👑',d:'50 ações',r:50,t:'tot'}],
quotes:['O Salvador ministrava um a um.','A caridade nunca falha.','Servir é amar em ação.','Apascenta minhas ovelhas.','O que fizestes ao menor, a mim o fizestes.','Amai-vos uns aos outros como eu vos amei.','Ide e fazei discípulos de todas as nações.','Vinde a mim, todos os que estais cansados e sobrecarregados.'],
record_types:['Visita','Ligação','Mensagem','WhatsApp','Ajuda','Serviço','Compartilhamento Espiritual','Convite','Oração','Apoio Emocional'],
service_types:['Mudança','Transporte','Doação','Alimentos','Limpeza','Manutenção','Projeto Humanitário','Visitação'],
goals:{visits:5,contacts:10,families:100,needs:3,invites:2},
hierarchy:['Bispado','Quórum de Élderes','Sociedade de Socorro','Jovens Rapazes','Moças','Primária','Missionários','Companheiros de Ministração'],
setupDone:false,profile:'Administrador',ward:'Minha Ala',
permissions:{Administrador:'all',Ministrador:'basic',Ministradora:'basic','Líder do Quórum':'leader','Líder Sociedade de Socorro':'leader',Bispado:'bishop'}
},
COLORS:['#3B6B9E','#2D8F6F','#C8850A','#8E6BAA','#CB6D3B','#C0392B','#2980B9','#27AE60','#D4AC0D','#7D3C98','#1ABC9C','#E74C3C'],

init(){
this.load();this.buildNav();
if(!this.d.setupDone)this.setup();else this.go('welcome');
this.applyTheme();this.keys();
setInterval(()=>this.save(),60000);
this.checkAlerts();
},
load(){const s=localStorage.getItem('md');if(s){this.d=JSON.parse(s);for(let k in this.DEFS)if(!(k in this.d))this.d[k]=JSON.parse(JSON.stringify(this.DEFS[k]))}else this.d=JSON.parse(JSON.stringify(this.DEFS))},
save(){localStorage.setItem('md',JSON.stringify(this.d))},
uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)},
buildNav(){
let h='';this.NAV.forEach(s=>{h+=`<div class="ns">${s.s}</div>`;s.items.forEach(i=>{h+=`<div class="ni${this.v===i.v?' on':''}" data-v="${i.v}" onclick="A.go('${i.v}')"><span class="ic">${i.i}</span>${i.t}</div>`})});
document.getElementById('navItems').innerHTML=h
},
go(v){
this.v=v;document.querySelectorAll('.ni[data-v]').forEach(e=>e.classList.toggle('on',e.dataset.v===v));
document.querySelectorAll('.bn-i').forEach(e=>e.classList.toggle('on',e.dataset.v===v));
let t='';this.NAV.forEach(s=>s.items.forEach(i=>{if(i.v===v)t=i.t}));
document.getElementById('ht').textContent=t||v;
document.getElementById('fab').classList.toggle('hid',['welcome','dashboard','mission','levels','impact','wardview','wardhealth','backup','profiles','hierarchy'].includes(v));
this.render();this.sidebar(false)
},
render(){const m=document.getElementById('mn');const fn=this['v_'+this.v];if(fn){m.innerHTML=fn.call(this);m.className='mn fade'+(document.getElementById('sb').classList.contains('open')?'':' full');this['a_'+this.v]?.call(this)}},
sidebar(f){const s=document.getElementById('sb');const b=document.getElementById('bk');const o=f!==undefined?f:!s.classList.contains('open');s.classList.toggle('open',o);b.classList.toggle('on',o)},
theme(){const d=document.documentElement;const dk=d.getAttribute('data-theme')==='dark';d.setAttribute('data-theme',dk?'':'dark');document.getElementById('tb').textContent=dk?'🌙':'☀️';localStorage.setItem('th',dk?'l':'d')},
applyTheme(){if(localStorage.getItem('th')==='d'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('tb').textContent='☀️'}},
toast(m,t='ok',undo){const c=document.getElementById('tc');const e=document.createElement('div');e.className='tt tt-'+t;e.innerHTML=m+(undo?`<button class="undo-btn" onclick="A.doUndo(this)">Desfazer</button>`:'');c.appendChild(e);setTimeout(()=>e.remove(),undo?6000:3000)},
doUndo(btn){if(this._undo){this._undo();this._undo=null;btn.closest('.tt').remove();this.render();this.toast('↩️ Ação desfeita')}},
sm(t,b,f=''){document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=b;document.getElementById('mf').innerHTML=f;document.getElementById('mo').classList.add('on')},
cm(){document.getElementById('mo').classList.remove('on')},
q(){return this.d.quotes[Math.floor(Math.random()*this.d.quotes.length)]},
da(ds){if(!ds)return 999;return Math.floor((Date.now()-new Date(ds).getTime())/864e5)},
rd(ds){if(!ds)return'Sem contato';const d=this.da(ds);if(d===0)return'Hoje';if(d===1)return'Ontem';if(d<7)return`${d} dias atrás`;if(d<30)return`${Math.floor(d/7)} sem. atrás`;if(d<365)return`${Math.floor(d/30)} meses atrás`;return`${Math.floor(d/365)} ano(s) atrás`},
rc(d){if(d<=30)return'l';if(d<=60)return'm';if(d<=90)return'h';return'c'},
rb(d){if(d<=30)return'<span class="bd-g bdg">🟢 Em dia</span>';if(d<=60)return'<span class="bd-g bdy">🟡 Atenção</span>';if(d<=90)return'<span class="bd-g bdo">🟠 Risco</span>';return'<span class="bd-g bdr">🔴 Crítico</span>'},
lc(fid){const r=this.d.records.filter(r=>r.fid===fid);if(!r.length)return null;return r.sort((a,b)=>new Date(b.dt)-new Date(a.dt))[0].dt},
xp(){return this.d.records.length*10+this.d.miracles.length*25},
lvl(){const x=this.xp();const l=[...this.d.levels].sort((a,b)=>b.x-a.x);for(let i of l)if(x>=i.x)return i;return this.d.levels[0]},
avC(n){const i=(n||'?').charAt(0).toUpperCase();const ci=n?n.charCodeAt(0)%this.COLORS.length:0;return`<div class="av" style="background:${this.COLORS[ci]}">${i}</div>`},
avCS(n){const i=(n||'?').charAt(0).toUpperCase();const ci=n?n.charCodeAt(0)%this.COLORS.length:0;return`<div class="av av-sm" style="background:${this.COLORS[ci]}">${i}</div>`},
avCL(n){const i=(n||'?').charAt(0).toUpperCase();const ci=n?n.charCodeAt(0)%this.COLORS.length:0;return`<div class="av av-lg" style="background:${this.COLORS[ci]}">${i}</div>`},
today(){return new Date().toISOString().split('T')[0]},
mp(){const w=this.wk();const m=this.d['ms_'+w]||{};const it=[{k:'visit',l:'Fazer 1 visita',i:'🏠'},{k:'c1',l:'Fazer 1 contato',i:'📞'},{k:'c2',l:'Fazer 2º contato',i:'📞'},{k:'spi',l:'Compartilhar mensagem espiritual',i:'📖'},{k:'inv',l:'Fazer um convite',i:'🎉'},{k:'need',l:'Identificar necessidade',i:'🔍'}];return{it,m,dn:it.filter(i=>m[i.k]).length,tt:it.length,w}},
wk(){const d=new Date();const s=new Date(d.getFullYear(),0,1);return d.getFullYear()+'w'+Math.ceil(((d-s)/864e5+s.getDay()+1)/7)},
tm(){const n=new Date();return this.d.records.filter(r=>{const d=new Date(r.dt);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()})},
hasPerm(p){const pr=this.d.permissions[this.d.profile];return pr==='all'||pr===p||p==='basic'},

fab(){
const v=this.v;
if(v==='families')this.ffm();else if(v==='companions')this.cfm();else if(v==='needs')this.nfm();
else if(v==='records')this.rfm();else if(v==='neighborhoods')this.nbfm();else if(v==='calendar')this.efm();
else if(v==='planner')this.pfm();else if(v==='messages')this.msgfm();else if(v==='miracles')this.mrfm();
else if(v==='today')this.rfm();else if(v==='actions')this.pfm();else if(v==='activities')this.actfm();
else if(v==='documents')this.docfm()
},
keys(){document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();this.showSearch()}if(e.key==='Escape')this.cm()})},
meeting(){document.body.classList.toggle('meeting');const on=document.body.classList.contains('meeting');document.getElementById('meetBtn').innerHTML=`<span class="ic">${on?'📺':'📺'}</span>${on?'Sair Reunião':'Modo Reunião'}`;this.toast(on?'📺 Modo reunião ativado':'📺 Modo normal')},
reset(){if(confirm('Reiniciar todo o sistema? Todos os dados serão perdidos.')){localStorage.removeItem('md');location.reload()}},
checkAlerts(){const n=document.getElementById('nb');const has=this.d.families.some(f=>this.da(this.lc(f.id))>=30)||this.d.needs.some(n=>n.st!=='ok'&&n.st!=='done');n.classList.toggle('has-notif',has)},

showSearch(){this.sm('🔍 Pesquisa Global',`<div class="fg"><input class="fi" id="gs" placeholder="Pesquisar famílias, registros..." oninput="A.doSearch(this.value)" autofocus></div><div id="sr"></div>`)},
doSearch(q){if(!q||q.length<2){document.getElementById('sr').innerHTML='';return}q=q.toLowerCase();let h='';
const f=this.d.families.filter(f=>f.nm.toLowerCase().includes(q)||(f.ad||'').toLowerCase().includes(q));
if(f.length){h+='<p style="font-weight:600;margin:8px 0">👥 Famílias</p>';f.forEach(x=>{h+=`<div class="li" style="cursor:pointer" onclick="A.cm();A.go('families');setTimeout(()=>A.fdet('${x.id}'),100)">${this.avCS(x.nm)}<span>${x.nm}</span></div>`})}
const r=this.d.records.filter(r=>(r.desc||'').toLowerCase().includes(q));
if(r.length){h+='<p style="font-weight:600;margin:8px 0">📝 Registros</p>';r.slice(0,5).forEach(x=>{h+=`<div class="li">${x.dt} - ${x.tp}: ${(x.desc||'').substring(0,40)}</div>`})}
if(!h)h='<div class="es"><p>Nenhum resultado</p></div>';document.getElementById('sr').innerHTML=h},

showAlerts(){
const al=[];
this.d.families.forEach(f=>{const d=this.da(this.lc(f.id));if(d>=30)al.push({i:'⚠️',t:`${f.nm} — ${this.rd(this.lc(f.id))}`,p:d})});
this.d.needs.filter(n=>n.st!=='ok'&&n.st!=='done').forEach(n=>{const f=this.d.families.find(x=>x.id===n.fid);al.push({i:n.pr==='Urgente'?'🔴':'📋',t:`${n.cat}: ${f?.nm||'?'} — ${(n.desc||'').substring(0,30)}`,p:n.pr==='Urgente'?999:50})});
this.d.families.forEach(f=>{if(f.bd){const b=new Date(f.bd),t=new Date();b.setFullYear(t.getFullYear());const df=Math.floor((b-t)/864e5);if(df>=0&&df<=7)al.push({i:'🎂',t:`Aniversário: ${f.nm} ${df===0?'HOJE':'em '+df+' dia(s)'}`,p:200-df})}});
al.sort((a,b)=>b.p-a.p);
this.sm('🔔 Alertas',al.length?al.map(a=>`<div class="li">${a.i} ${a.t}</div>`).join(''):'<div class="es"><div class="ei">✅</div><p>Nenhum alerta!</p></div>')},

// ═══ SETUP ═══
setup(){document.getElementById('sb').classList.add('shut');document.getElementById('hd').classList.add('full');document.getElementById('mn').classList.add('full');this._ss=1;this._sr()},
_sr(){
const m=document.getElementById('mn');
let h='<div class="ws fade"><div class="wz"><div class="wzs'+(this._ss>=1?' on':'')+(this._ss>1?' ok':'')+'">1</div><div class="wzs'+(this._ss>=2?' on':'')+(this._ss>2?' ok':'')+'">2</div><div class="wzs'+(this._ss>=3?' on':'')+'">3</div></div>';
if(this._ss===1){
h+=`<div style="font-size:48px">🤝</div><h2 style="margin:8px 0">Companheiros de Ministração</h2><p style="color:var(--tx2);margin-bottom:20px;font-size:13px">Quem são vocês?</p>
<div style="max-width:380px;width:100%;text-align:left">
<div class="fg"><label class="fl">Nome do Companheiro 1</label><input class="fi" id="s1n" value="${this.d.companions[0]?.nm||''}"></div>
<div class="fg"><label class="fl">Telefone</label><input class="fi" id="s1p" value="${this.d.companions[0]?.ph||''}"></div>
<div class="fg"><label class="fl">Nome do Companheiro 2</label><input class="fi" id="s2n" value="${this.d.companions[1]?.nm||''}"></div>
<div class="fg"><label class="fl">Telefone</label><input class="fi" id="s2p" value="${this.d.companions[1]?.ph||''}"></div>
<button class="bt bp bbl blg" onclick="A._s1()">SALVAR COMPANHEIROS →</button></div>`
}else if(this._ss===2){
h+=`<div style="font-size:48px">👥</div><h2 style="margin:8px 0">Famílias Designadas</h2><p style="color:var(--tx2);margin-bottom:20px;font-size:13px">Cadastre as famílias</p>
<div style="max-width:460px;width:100%;text-align:left"><div id="sfl">`;
this.d.families.forEach(f=>{h+=`<div class="fc" style="cursor:default">${this.avCS(f.nm)}<div style="flex:1"><div class="fn">${f.nm}</div><div class="fd">${f.ph||''}</div></div><button class="bt bsm bd" onclick="A._srf('${f.id}')">🗑</button></div>`});
h+=`</div><div class="cd" style="margin-top:12px">
<div class="fg"><label class="fl">Nome da Família</label><input class="fi" id="sfn"></div>
<div class="fg"><label class="fl">Telefone</label><input class="fi" id="sfp"></div>
<div class="fg"><label class="fl">Endereço</label><input class="fi" id="sfa"></div>
<div class="fg"><label class="fl">Bairro</label><input class="fi" id="sfb"></div>
<button class="bt ba bbl" onclick="A._saf()">➕ Adicionar Família</button></div>
<div style="display:flex;gap:8px;margin-top:12px"><button class="bt bo" onclick="A._ss=1;A._sr()">← Voltar</button><button class="bt bp" style="flex:1" onclick="A._ss=3;A._sr()">Continuar →</button></div></div>`
}else{
h+=`<div style="font-size:48px" class="celeb">✅</div><h2 style="margin:12px 0;color:var(--ok)">Sistema Pronto!</h2>
<div style="max-width:380px;text-align:left;margin-bottom:20px"><div class="al al-s">✅ Companheiros: ${this.d.companions.length}</div><div class="al al-s">✅ Famílias: ${this.d.families.length}</div><div class="al al-s">✅ Pronto para uso</div></div>
<button class="bt bp blg" onclick="A._sf()">🛠️ COMEÇAR A MINISTRAR</button><br><button class="bt bo" style="margin-top:8px" onclick="A._ss=2;A._sr()">← Voltar</button>`
}
h+='</div>';m.innerHTML=h
},
_s1(){const c1={id:this.uid(),nm:document.getElementById('s1n').value.trim(),ph:document.getElementById('s1p').value};const c2={id:this.uid(),nm:document.getElementById('s2n').value.trim(),ph:document.getElementById('s2p').value};this.d.companions=[c1];if(c2.nm)this.d.companions.push(c2);this.save();this._ss=2;this._sr();this.toast('✅ Companheiros salvos')},
_saf(){const n=document.getElementById('sfn').value.trim();if(!n){this.toast('Digite o nome','wr');return}this.d.families.push({id:this.uid(),nm:n,ph:document.getElementById('sfp').value,ad:document.getElementById('sfa').value,nb:document.getElementById('sfb').value,st:'Ativa',cr:this.today(),mb:[],int:'',tal:'',pra:'',ch:'',em:'',wa:'',rg:'',bd:'',obs:'',tags:[]});this.save();this._sr();this.toast('✅ Família adicionada')},
_srf(id){this.d.families=this.d.families.filter(f=>f.id!==id);this.save();this._sr()},
_sf(){this.d.setupDone=true;this.save();document.getElementById('sb').classList.remove('shut');document.getElementById('hd').classList.remove('full');document.getElementById('mn').classList.remove('full');this.go('welcome')},

// ═══ WELCOME ═══
v_welcome(){
const tf=this.d.families.length,no=this.d.needs.filter(n=>n.st!=='ok'&&n.st!=='done').length;
const nc=this.d.families.filter(f=>this.da(this.lc(f.id))>30).length;
const tm=this.tm().length,mp=this.mp(),lv=this.lvl(),xp=this.xp();
const ws=this.weekSummary();
return`<div class="ws">
<div class="wi">🛠️</div><h1 class="wt">Ministrando à Maneira do Senhor</h1><p class="wst">Cuidando de pessoas como o Salvador cuidaria</p>
<div class="wsc">"Quando estais a serviço de vosso próximo, estais somente a serviço de vosso Deus."<cite>Mosias 2:17</cite></div>
<div class="g g4" style="width:100%;max-width:760px;margin-bottom:20px">
<div class="sc acc" onclick="A.go('families')"><div class="si">👥</div><div class="sv">${nc}</div><div class="sl">Aguardando contato</div></div>
<div class="sc red" onclick="A.go('needs')"><div class="si">🙏</div><div class="sv">${no}</div><div class="sl">Necessidades abertas</div></div>
<div class="sc pri" onclick="A.go('mission')"><div class="si">🎯</div><div class="sv">${mp.dn}/${mp.tt}</div><div class="sl">Missão da semana</div></div>
<div class="sc grn" onclick="A.go('impact')"><div class="si">⭐</div><div class="sv">${tm}</div><div class="sl">Impacto do mês</div></div>
</div>
${ws?`<div class="al al-i" style="max-width:500px;width:100%;margin-bottom:14px">${ws}</div>`:''}
<div class="lvl" style="max-width:380px;width:100%"><div class="lvi">${lv.i}</div><div style="flex:1"><div class="lvn">${lv.n}</div><div class="lvx">${xp} XP</div><div class="pr" style="margin-top:4px"><div class="pb" style="width:${Math.min(100,xp/10)}%"></div></div></div></div>
<div class="ib" style="max-width:460px;width:100%">"${this.q()}"</div>

a_dashboard(){
const cv=document.getElementById('dashChart');if(!cv)return;
const ctx=cv.getContext('2d');const tm=this.tm();
const types=['Visita','Ligação','Mensagem','WhatsApp','Ajuda','Oração'];
const vals=types.map(t=>tm.filter(r=>r.tp===t).length);
const max=Math.max(...vals,1);
const w=cv.width=cv.parentElement.clientWidth-32;const h=cv.height=160;
ctx.clearRect(0,0,w,h);
const bw=Math.min(40,(w-types.length*8)/types.length);
const gap=(w-types.length*bw)/(types.length+1);
types.forEach((t,i)=>{
const x=gap+(bw+gap)*i;const bh=vals[i]/max*(h-40);const y=h-25-bh;
const g=ctx.createLinearGradient(x,y,x,h-25);g.addColorStop(0,'#3B6B9E');g.addColorStop(1,'#6B9FCC');
ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,bw,bh,4);ctx.fill();
ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--tx2');ctx.font='10px sans-serif';ctx.textAlign='center';
ctx.fillText(vals[i],x+bw/2,y-4);ctx.fillText(t.substring(0,4),x+bw/2,h-8)
})
},

v_impact(){const tm=this.tm(),ci=[...new Set(tm.map(r=>r.fid))],v=tm.filter(r=>r.tp==='Visita').length,c=tm.filter(r=>['Ligação','Mensagem','WhatsApp'].includes(r.tp)).length,s=tm.filter(r=>r.tp==='Compartilhamento Espiritual').length,hp=tm.filter(r=>['Ajuda','Serviço'].includes(r.tp)).length;

</div>
<div class="cd"><div class="cd-t">📊 Atividades</div><canvas id="impChart" class="chart-canvas" height="160" style="margin-top:10px"></canvas></div>
<div class="cd" style="margin-top:14px;text-align:center"><div class="cd-t">✨ Milagres</div><div class="sv" style="font-size:32px;margin:12px 0;color:var(--a)">${this.d.miracles.length}</div></div>`
},
a_impact(){
const cv=document.getElementById('impChart');if(!cv)return;
const ctx=cv.getContext('2d');const tm=this.tm();const ts=['Visita','Ligação','Mensagem','Ajuda','Oração'];const vs=ts.map(t=>tm.filter(r=>r.tp===t).length);const mx=Math.max(...vs,1);
const w=cv.width=cv.parentElement.clientWidth-32;const h=cv.height=160;ctx.clearRect(0,0,w,h);

ts.forEach((t,i)=>{const x=gap+(bw+gap)*i;const bh=vs[i]/mx*(h-40);const y=h-25-bh;const g=ctx.createLinearGradient(x,y,x,h-25);g.addColorStop(0,'#3B6B9E');g.addColorStop(1,'#6B9FCC');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,bw,bh,4);ctx.fill();ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--tx2');ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(vs[i],x+bw/2,y-4);ctx.fillText(t.substring(0,4),x+bw/2,h-8)})
},

a_wardview(){
const cv=document.getElementById('wardChart');if(!cv)return;const ctx=cv.getContext('2d');
const w=cv.width=cv.parentElement.clientWidth-32;const h=cv.height=140;ctx.clearRect(0,0,w,h);
const ms=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const now=new Date();const vals=[];
for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);vals.push({l:ms[d.getMonth()],v:this.d.records.filter(r=>{const rd=new Date(r.dt);return rd.getMonth()===d.getMonth()&&rd.getFullYear()===d.getFullYear()}).length})}
const mx=Math.max(...vals.map(v=>v.v),1);const pw=(w-40)/Math.max(vals.length-1,1);

vals.forEach((v,i)=>{const x=20+pw*i;const y=h-25-v.v/mx*(h-45);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();
vals.forEach((v,i)=>{const x=20+pw*i;const y=h-25-v.v/mx*(h-45);ctx.fillStyle='var(--p)';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--tx2');ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText(v.v,x,y-8);ctx.fillText(v.l,x,h-8)})
},

<div class="cd"><div class="cd-t">🚨 Precisam de Atenção</div><div style="margin-top:10px">`;
const att=this.d.families.filter(f=>this.da(this.lc(f.id))>60).sort((a,b)=>this.da(this.lc(b.id))-this.da(this.lc(a.id)));
if(att.length)att.slice(0,15).forEach(f=>{const d=this.da(this.lc(f.id));h+=`<div class="li" style="cursor:pointer" onclick="A.fdet('${f.id}')">${this.avCS(f.nm)}<span style="flex:1">${f.nm} — <span class="rd">${this.rd(this.lc(f.id))}</span></span>${this.rb(d)}</div>`});
else h+='<p style="color:var(--tx3);text-align:center;padding:14px">✅ Todas bem acompanhadas!</p>';
h+='</div></div>';return h
},

// ═══ SETTINGS ═══
v_settings(){return`<div class="sh"><div><div class="st">⚙️ Configurações</div></div></div>
<div class="tabs"><div class="tab on" onclick="A.stab('gen')">Geral</div><div class="tab" onclick="A.stab('cat')">Categorias</div><div class="tab" onclick="A.stab('typ')">Tipos</div><div class="tab" onclick="A.stab('gol')">Metas</div><div class="tab" onclick="A.stab('quo')">Frases</div><div class="tab" onclick="A.stab('tag')">Tags</div></div><div id="sc">${this.sgen()}</div>`},
stab(t){document.querySelectorAll('.tabs .tab').forEach((e,i)=>e.classList.toggle('on',['gen','cat','typ','gol','quo','tag'][i]===t));const c=document.getElementById('sc');if(t==='gen')c.innerHTML=this.sgen();else if(t==='cat')c.innerHTML=this.slist('categories','Categorias',this.d.categories);else if(t==='typ')c.innerHTML=this.slist('record_types','Tipos',this.d.record_types);else if(t==='gol')c.innerHTML=this.sgol();else if(t==='quo')c.innerHTML=this.slist('quotes','Frases',this.d.quotes);else if(t==='tag')c.innerHTML=this.stags()},
sgen(){return`<div class="cd"><h3 style="margin-bottom:12px;font-size:14px">⛪ Ala</h3><div class="fg"><label class="fl">Nome</label><input class="fi" value="${this.d.ward}" onchange="A.d.ward=this.value;A.save()"></div><div class="fg"><label class="fl">Perfil</label><select class="fs" onchange="A.d.profile=this.value;A.save()"><option ${this.d.profile==='Ministrador'?'selected':''}>Ministrador</option><option ${this.d.profile==='Ministradora'?'selected':''}>Ministradora</option><option ${this.d.profile==='Líder do Quórum'?'selected':''}>Líder do Quórum</option><option ${this.d.profile==='Líder Sociedade de Socorro'?'selected':''}>Líder Sociedade de Socorro</option><option ${this.d.profile==='Bispado'?'selected':''}>Bispado</option><option ${this.d.profile==='Administrador'?'selected':''}>Administrador</option></select></div></div><div class="cd" style="margin-top:12px"><h3 style="margin-bottom:8px;font-size:14px">📊 Estatísticas</h3><div class="g g3" style="text-align:center"><div><strong>${this.d.families.length}</strong><br><small style="color:var(--tx2)">Famílias</small></div><div><strong>${this.d.records.length}</strong><br><small style="color:var(--tx2)">Registros</small></div><div><strong>${this.d.miracles.length}</strong><br><small style="color:var(--tx2)">Milagres</small></div></div></div>`},
slist(k,t,it){let h=`<div class="cd"><h3 style="margin-bottom:12px;font-size:14px">${t}</h3><div class="fg" style="display:flex;gap:6px"><input class="fi" id="si_${k}" placeholder="Adicionar..."><button class="bt bp" onclick="A.sadd('${k}')">➕</button></div>`;it.forEach((x,i)=>{h+=`<div class="li"><span style="flex:1;font-size:13px">${x}</span><button class="bt bsm bo" onclick="A.sed('${k}',${i})">✏️</button><button class="bt bsm bd" onclick="A.srem('${k}',${i})">🗑</button></div>`});h+='</div>';return h},
sadd(k){const i=document.getElementById('si_'+k);if(!i.value.trim())return;this.d[k].push(i.value.trim());this.save();this.stab(k==='record_types'?'typ':k==='categories'?'cat':'quo');this.toast('✅')},
sed(k,i){const v=prompt('Editar:',this.d[k][i]);if(v!==null){this.d[k][i]=v;this.save();this.stab(k==='record_types'?'typ':k==='categories'?'cat':'quo')}},
srem(k,i){this.d[k].splice(i,1);this.save();this.stab(k==='record_types'?'typ':k==='categories'?'cat':'quo')},
sgol(){const g=this.d.goals;return`<div class="cd"><h3 style="margin-bottom:12px;font-size:14px">🎯 Metas</h3><div class="fg"><label class="fl">Visitas/mês</label><input class="fi" type="number" value="${g.visits}" onchange="A.d.goals.visits=+this.value;A.save()"></div><div class="fg"><label class="fl">Contatos/mês</label><input class="fi" type="number" value="${g.contacts}" onchange="A.d.goals.contacts=+this.value;A.save()"></div><div class="fg"><label class="fl">Famílias acompanhadas (%)</label><input class="fi" type="number" value="${g.families}" onchange="A.d.goals.families=+this.value;A.save()"></div><div class="fg"><label class="fl">Necessidades atendidas</label><input class="fi" type="number" value="${g.needs}" onchange="A.d.goals.needs=+this.value;A.save()"></div><div class="al al-s">✅ Salvo automaticamente</div></div>`},
stags(){const tg=this.d.tags||[];let h=`<div class="cd"><h3 style="margin-bottom:12px;font-size:14px">🏷️ Tags</h3><div class="fg" style="display:flex;gap:6px"><input class="fi" id="tn" placeholder="Nome da tag"><input class="fi" type="color" id="tc2" value="#3B6B9E" style="width:50px;padding:4px"><button class="bt bp" onclick="A.tadd()">➕</button></div>`;tg.forEach((t,i)=>{h+=`<div class="li"><span class="tag" style="background:${t.c};color:#fff">${t.n}</span><span style="flex:1"></span><button class="bt bsm bd" onclick="A.trem(${i})">🗑</button></div>`});h+='</div>';return h},
tadd(){const n=document.getElementById('tn').value.trim();if(!n)return;this.d.tags=this.d.tags||[];this.d.tags.push({n,c:document.getElementById('tc2').value});this.save();this.stab('tag');this.toast('✅')},
trem(i){this.d.tags.splice(i,1);this.save();this.stab('tag')},

// ═══ PROFILES ═══
v_profiles(){const ps=[{n:'Ministrador',i:'👤',p:['Ver famílias designadas','Registrar']},{n:'Ministradora',i:'👤',p:['Ver famílias designadas','Registrar']},{n:'Líder do Quórum',i:'👨',p:['Ver todas famílias','Alterar','Exportar','Painel']},{n:'Líder Sociedade de Socorro',i:'👩',p:['Ver todas famílias','Alterar','Exportar','Painel']},{n:'Bispado',i:'⛪',p:['Tudo exceto admin']},{n:'Administrador',i:'⚙️',p:['Todas as permissões']}];
let h=`<div class="sh"><div><div class="st">👤 Perfis</div></div></div><div class="al al-i">Perfil: <strong>${this.d.profile}</strong></div><div class="g ga">`;
ps.forEach(p=>{const on=p.n===this.d.profile;h+=`<div class="cd" style="${on?'border:2px solid var(--p)':''}"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="font-size:22px">${p.i}</span><h3 style="font-size:14px">${p.n}</h3>${on?'<span class="bd-g bdp">Ativo</span>':''}</div><div style="font-size:11px;color:var(--tx2)">${p.p.map(x=>'✅ '+x).join('<br>')}</div><button class="bt bsm ${on?'bp':'bo'}" style="margin-top:8px" onclick="A.d.profile='${p.n}';A.save();A.render();A.toast('✅')">${on?'✅ Ativo':'Selecionar'}</button></div>`});
h+='</div>';return h
},

// ═══ BACKUP ═══
v_backup(){const sz=(new Blob([JSON.stringify(this.d)]).size/1024).toFixed(1);return`<div class="sh"><div><div class="st">💾 Backup</div></div></div>
<div class="cd" style="margin-bottom:14px"><div class="cd-t">📊 Info</div><p style="color:var(--tx2);font-size:12px;margin-top:6px">Tamanho: ${sz} KB · Último: ${localStorage.getItem('lb')||'Nunca'}</p></div>
<div class="g g2"><div class="cd" style="text-align:center"><div style="font-size:32px">📤</div><h3 style="font-size:14px;margin:6px 0">Exportar</h3><button class="bt bp bbl" onclick="A.expBk()">📤 Exportar JSON</button></div><div class="cd" style="text-align:center"><div style="font-size:32px">📥</div><h3 style="font-size:14px;margin:6px 0">Importar</h3><input type="file" id="impf" accept=".json" style="display:none" onchange="A.impBk(event)"><button class="bt ba bbl" onclick="document.getElementById('impf').click()">📥 Importar JSON</button></div></div>
<div class="g g2" style="margin-top:14px"><div class="cd" style="text-align:center"><div style="font-size:32px">📄</div><h3 style="font-size:14px;margin:6px 0">CSV</h3><button class="bt bo bbl" onclick="A.expCSV()">📄 Exportar</button></div><div class="cd" style="text-align:center"><div style="font-size:32px">🖨️</div><h3 style="font-size:14px;margin:6px 0">Imprimir</h3><button class="bt bo bbl" onclick="A.printRep()">🖨️ Imprimir</button></div></div>`},
expBk(){const b=new Blob([JSON.stringify(this.d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`ministrando_${this.today()}.json`;a.click();localStorage.setItem('lb',new Date().toLocaleString('pt-BR'));this.toast('📤 Exportado')},
impBk(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(confirm('Restaurar backup?')){this.d=d;this.save();this.render();this.toast('✅ Restaurado')}}catch(er){this.toast('❌ Inválido','er')}};r.readAsText(f)},
expD(t){const b=new Blob([JSON.stringify(this.d[t]||this.d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`${t}_${this.today()}.json`;a.click();this.toast('📤 Exportado')},
printRep(){let h=`<html><head><title>Relatório</title><style>body{font-family:sans-serif;padding:20px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border:1px solid #ddd;text-align:left;font-size:11px}th{background:#f5f5f5}</style></head><body><h1 style="text-align:center">🛠️ Ministrando à Maneira do Senhor</h1><p style="text-align:center">${new Date().toLocaleDateString('pt-BR')}</p><h2>Famílias (${this.d.families.length})</h2><table><tr><th>Nome</th><th>Tel</th><th>Bairro</th><th>Status</th><th>Último</th><th>Dias</th></tr>`;this.d.families.forEach(f=>{const lc=this.lc(f.id),d=this.da(lc);h+=`<tr><td>${f.nm}</td><td>${f.ph||''}</td><td>${f.nb||''}</td><td>${f.st||''}</td><td>${lc||'—'}</td><td>${d}</td></tr>`});h+='</table></body></html>';const w=window.open('','_blank');w.document.write(h);w.document.close();w.print()},
};
document.addEventListener('DOMContentLoaded',()=>A.init());
</script>
</body>
</html>
